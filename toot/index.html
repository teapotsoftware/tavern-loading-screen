<html>
	<head>
		<link rel="preconnect" href="https://fonts.googleapis.com">
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
		<link href="https://fonts.googleapis.com/css2?family=Alfa+Slab+One&display=swap" rel="stylesheet">
		<title>Loading..</title>
		<style>
			.alfa-slab-one-regular {
			  font-family: "Alfa Slab One", serif;
			  font-weight: 400;
			  font-style: normal;
			}

			body {
				background-image: url('bg.jpg');
				background-position: center;
				background-size: cover;
				overflow: hidden;
				margin: 0px;
			}

			#boi {
				position: absolute;
				top: 72%;
				left: 43%;
				transform: translate(-50%, -100%) scale(1.5, 1.5);
				z-index: 0;
			}

			#map {
				position: absolute;
				transform: translate(-50%, -50%);
				left: 50%;
				top: 4%;
				color: white;
				font-family: "Alfa Slab One", serif;
				font-weight: 400;
				font-style: normal;
				font-size: 4vw;
				color: crimson;
			}

			#map2 {
				position: absolute;
				transform: translate(-50%, -50%);
				left: 50%;
				top: -1%;
				color: white;
				font-family: "Alfa Slab One", serif;
				font-weight: 100;
				font-style: normal;
				font-size: 2vw;
				color: crimson;
			}
		</style>
	</head>
	<body>
		<img id="boi" src="boi.gif">

		<h3 id="map2"></h3>
		<h1 id="map"></h1>

		<script type="text/javascript">
			window.GameDetails = function( servername, serverurl, mapname, maxplayers, steamid, gamemode, volume, language ) {
				document.getElementById("map2").innerHTML = "You're on your way to:";
				document.getElementById("map").innerHTML = mapname;
			}
		</script>

	</body>
</html>
